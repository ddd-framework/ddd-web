name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm version from package.json)
        run: npm i -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Published manifest has no workspace-only specifiers
        run: |
          if grep -E '"(workspace|link|file):' package.json; then
            echo "package.json contains workspace:/link:/file: specifiers" >&2
            exit 1
          fi
      - name: Build output has every exports / bin target
        run: node scripts/check-package.mjs .
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      # Per package manager: tarball contents (exports / bin targets), runtime imports of every subpath, a strict
      # TypeScript consumer (moduleResolution bundler and nodenext), ddd-web-sdk on the sample spec with a type check
      # of the generated SDK, and link-skills.
      - name: Consumer check with npm
        run: test/consumer/run.sh "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-web-*.tgz)" npm "$RUNNER_TEMP/consumer-npm"
      - name: Consumer check with pnpm
        run: test/consumer/run.sh "$(ls "$RUNNER_TEMP"/mgamadeus-ddd-web-*.tgz)" pnpm "$RUNNER_TEMP/consumer-pnpm"
